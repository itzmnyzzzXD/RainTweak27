name: Build IPA Artifact

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Optional direct HTTPS URL; leave blank to use a Discord IPA attached to the latest GitHub Release"
        required: false
        default: ""
        type: string
      bundle_id:
        description: "Unique bundle ID to use for your own signing profile"
        required: true
        default: "com.itzmnyzzxd.discord"
        type: string

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build and package RainTweak IPA
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      IPA_URL: ${{ inputs.ipa_url }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout RainTweak27
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify Xcode 27 and validate build settings
        run: |
          set -euo pipefail
          if [ -n "$IPA_URL" ]; then
            echo "::add-mask::$IPA_URL"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse
          value = os.environ.get("IPA_URL", "").strip()
          if value:
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.hostname:
                  raise SystemExit("ipa_url must be a direct HTTPS URL.")
              if parsed.username or parsed.password:
                  raise SystemExit("Do not put credentials in the IPA URL.")
          bundle_id = os.environ.get("BUNDLE_ID", "").strip()
          if not re.fullmatch(r"[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+", bundle_id):
              raise SystemExit("bundle_id must be a dotted identifier (example: com.example.discord).")
          print(f"Using signing bundle ID: {bundle_id}")
          PY

      - name: Download Discord IPA automatically
        run: |
          set -euo pipefail
          if [ -n "$IPA_URL" ]; then
            echo "Using the optional direct IPA URL provided for this run."
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 \
              "$IPA_URL" --output discord.ipa
          else
            echo "No URL provided. Looking for a .ipa attached to the latest RainTweak27 GitHub Release..."
            RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>/dev/null || true)"
            if [ -z "$RELEASE_JSON" ]; then
              echo "::error::No latest release with a source IPA could be found. Attach an authorized, decrypted Discord IPA named Discord.ipa to a release, or provide the optional URL."
              exit 1
            fi
            ASSET_URL="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; assets=[x for x in json.load(sys.stdin).get("assets",[]) if x.get("name","").lower().endswith(".ipa")]; name=lambda x:x.get("name","").lower(); exact=[x for x in assets if name(x) in ("discord.ipa","discord-decrypted.ipa")]; discord=[x for x in assets if "discord" in name(x)]; generic=[x for x in assets if not any(term in name(x) for term in ("raintweak","rain-tweak","tweak-output","modified"))]; chosen=sorted(exact or discord,key=name)[0] if (exact or discord) else (generic[0] if len(generic)==1 else None); print(chosen["url"] if chosen else "")')"
            if [ -z "$ASSET_URL" ]; then
              echo "::error::Could not identify one unambiguous source IPA in the latest release. Prefer naming the authorized, decrypted source Discord.ipa or Discord-decrypted.ipa, or provide the optional direct HTTPS URL."
              exit 1
            fi
            gh api "$ASSET_URL" -H "Accept: application/octet-stream" > discord.ipa
          fi
          test -s discord.ipa
          unzip -tq discord.ipa
          echo "Source IPA downloaded and ZIP integrity checked."

      - name: Resolve Theos cache key
        run: |
          set -euo pipefail
          THEOS_HEAD="$(git ls-remote https://github.com/theos/theos HEAD | cut -f1)"
          SDK_HEAD="$(git ls-remote https://github.com/theos/sdks HEAD | cut -f1)"
          echo "THEOS_CACHE_KEY=${THEOS_HEAD}-${SDK_HEAD}" >> "$GITHUB_ENV"

      - name: Restore Theos cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-theos-ios27-${{ env.THEOS_CACHE_KEY }}

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1

      - name: Install build utilities
        run: |
          brew install make xcbeautify python@3.13
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build rootless tweak package
        run: |
          set -euo pipefail
          make package 2>&1 | tee make-package.log
          DEB_FILE="$(find packages -name '*iphoneos-arm64.deb' -print -quit)"
          if [ -z "$DEB_FILE" ]; then
            echo "No rootless arm64 package was produced."
            find packages -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "DEB_FILE=$DEB_FILE" >> "$GITHUB_ENV"
          echo "Built package: $DEB_FILE"

      - name: Checkout OpenInDiscord extension
        uses: actions/checkout@v4
        with:
          repository: castdrian/OpenInDiscord
          path: OpenInDiscord

      - name: Build OpenInDiscord extension with Xcode 27
        run: |
          set -euo pipefail
          cd OpenInDiscord
          xcodebuild build \
            -target "OpenInDiscord Extension" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="build" \
            PRODUCT_NAME="OpenInDiscord" \
            PRODUCT_BUNDLE_IDENTIFIER="com.hammerandchisel.discord.OpenInDiscord" \
            PRODUCT_MODULE_NAME="OpenInDiscordExt" \
            SKIP_INSTALL=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | xcbeautify
          test -d build/OpenInDiscord.appex

      - name: Install IPA injection tool
        run: |
          set -euo pipefail
          "$(brew --prefix python@3.13)/bin/python3.13" -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip Pillow lief
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Inject RainTweak and extension
        run: |
          set -euo pipefail
          APP_NAME="$(awk -F': ' '$1 == "Name" {print $2; exit}' control)"
          if [ -z "$APP_NAME" ]; then
            echo "Could not read the package Name from control."
            exit 1
          fi
          # Do not use -s/--fakesign here. FrozenApps signs this IPA using the
          # user's own Apple developer session before installing it on-device.
          cyan -duwgq -i discord.ipa -o "${APP_NAME}.ipa" -b "$BUNDLE_ID" \
            -l patch.plist -f "$DEB_FILE" OpenInDiscord/build/OpenInDiscord.appex
          test -s "${APP_NAME}.ipa"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Validate generated IPA
        run: |
          set -euo pipefail
          unzip -tq "${APP_NAME}.ipa"
          rm -rf ipa-validation
          mkdir ipa-validation
          ditto -x -k "${APP_NAME}.ipa" ipa-validation
          APP_PATH="$(find ipa-validation/Payload -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "IPA does not contain a valid Payload/*.app/Info.plist."
            exit 1
          fi
          plutil -lint "$APP_PATH/Info.plist"
          ACTUAL_BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Info.plist")"
          APP_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Info.plist" 2>/dev/null || echo unknown)"
          if [ "$BUNDLE_ID" != "$ACTUAL_BUNDLE_ID" ]; then
            echo "Generated IPA bundle ID $ACTUAL_BUNDLE_ID does not match requested signing bundle ID $BUNDLE_ID."
            exit 1
          fi
          {
            echo "RainTweak27 IPA build"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $ImageOS / $ImageVersion"
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "Bundle ID: $ACTUAL_BUNDLE_ID"
            echo "Discord version: $APP_VERSION"
            echo "Tweak package: $DEB_FILE"
            echo "IPA size bytes: $(stat -f%z "${APP_NAME}.ipa")"
            echo "Signing: intentionally not fake-signed; import into FrozenApps and sign before installation."
            echo "Note: successful archive validation is not proof of runtime iOS 27 compatibility."
          } > build-info.txt
          shasum -a 256 "${APP_NAME}.ipa" > "${APP_NAME}.ipa.sha256"
          cat build-info.txt
          cat "${APP_NAME}.ipa.sha256"

      - name: Upload IPA for FrozenApps
        uses: actions/upload-artifact@v4
        with:
          name: RainTweak27-IPA-for-FrozenApps
          path: |
            ${{ env.APP_NAME }}.ipa
            ${{ env.APP_NAME }}.ipa.sha256
            build-info.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload rootless package separately
        uses: actions/upload-artifact@v4
        with:
          name: RainTweak27-rootless-package
          path: ${{ env.DEB_FILE }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RainTweak27-build-diagnostics
          path: make-package.log
          if-no-files-found: ignore
          retention-days: 7
